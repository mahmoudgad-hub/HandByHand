<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>Hand By Hand</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E5D64">
  <base href="/">
  <link rel="icon" href="assets/brand/hbh-logo-mark.png">
  <style>.hbh-boot{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:radial-gradient(ellipse at top right,#e0f3ef,transparent 55%),#fafcfb;color:#12616b;font-family:Arial,sans-serif}.hbh-boot__logo{display:flex;align-items:center;gap:12px;max-width:80vw}.hbh-boot__logo img:first-child{width:65px;height:auto}.hbh-boot__logo img:last-child{width:190px;height:auto}.hbh-boot__ring{width:48px;height:48px;border:4px solid #dcefeb;border-top-color:#0097a4;border-right-color:#7eaf58;border-bottom-color:#ff8176;border-radius:50%;animation:hbh-boot-spin .9s linear infinite}.hbh-boot p{font-size:16px;margin:0}@keyframes hbh-boot-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.hbh-boot__ring{animation:none}}
</style>
</head>
<!-- .hbh-app scopes every design token from hbh-shared.css. -->
<body class="hbh-app">
  <hbh-root><div class="hbh-boot" role="status" aria-live="polite"><div class="hbh-boot__logo"><img src="assets/brand/hbh-logo-mark.png" alt=""><img src="assets/brand/hbh-logo-wordmark.png" alt="Hand By Hand"></div><span class="hbh-boot__ring" aria-hidden="true"></span><p>جارٍ تحميل التطبيق…</p></div></hbh-root>
</body>
</html>
