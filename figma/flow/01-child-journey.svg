  <text class="t" x="1360" y="200" text-anchor="end">طلب التحاق</text>
  <text class="n" x="1360" y="220" text-anchor="end">بابٌ واحد لكل المصادر: ويب وهاتف وحضور</text>
  <text class="c" x="1360" y="240" text-anchor="end">POST /enrolments  ·  بلا مصادقة  ·  NEW</text>

