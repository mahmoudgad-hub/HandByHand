# =====================================================================
# Hand By Hand - nginx site
#
# THREE server blocks, and one of them is not like the other two.
#
#   site    the public marketing pages. Static files, no API, no login,
#           no personal data. This is the block that faces the internet.
#   portal  the parent portal   - loopback, see below
#   ops     the operations console - loopback, see below
#
# Two applications, one origin each. apiBaseUrl is empty in the build
# (web/shared/src/config/app-config.ts:87), so the browser calls /api/v1
# on whatever host served the page: the SPA and the API must answer on
# the SAME origin, and there is no CORS in the picture at all.
#
# WHY THIS LISTENS ON 127.0.0.1 AND NOT ON 443
#
# The API runs with OTP_ECHO=true, which returns the one-time login code
# in the HTTP response body. It is on because APP_ENV=production forces
# it off and there is no SMS gateway yet - with it off, no parent can
# sign in at all. Published on the open internet, that combination means
# anyone who knows a parent's mobile number signs in as that parent and
# reads a child's clinical record.
#
# So this stays on loopback and is reached through an SSH tunnel:
#
#   ssh -L 8091:127.0.0.1:8091 -L 8092:127.0.0.1:8092 gad
#   http://localhost:8091   parent portal
#   http://localhost:8092   operations console
#
# TO PUBLISH IT LATER: an SMS gateway has to exist first, so that
# OTP_ECHO can go off and APP_ENV can be production. Then swap the
# listen lines for the commented ones, point a name at this host, and
# run certbot. Not before.
# =====================================================================

# =====================================================================
# THE PUBLIC SITE
#
# This block MAY listen on 443, today, and the two below may not. The
# difference is not that this one is less important - it is that it
# serves files and nothing else:
#
#   * no proxy_pass. Not to /api/, not to /healthz, not anywhere. The
#     paragraph above explains what publishing the API would cost while
#     OTP_ECHO is on; the way to be sure it does not happen by accident
#     is that this block contains no route to it. Do not add one "for
#     the enrolment form" - that form lives in the portal.
#   * no login, no token, no cookie, no row belonging to a family.
#
# The site links to the portal by absolute URL from site/config.js, so
# the two stay on separate origins and a visitor here is never one path
# away from an authenticated surface.
#
# OWNER: point a real name at this host and run certbot before swapping
# the listen lines. The site is worth publishing as soon as the centre's
# real phone number is in site/config.js.
# =====================================================================
server {
    listen 127.0.0.1:8093;
    # listen 443 ssl;
    # server_name handbyhand.example.eg;

    root /home/collab/hand-by-hand/site;
    index index.html;

    # A set of pages, not a single-page application: an unknown path is
    # a broken link and should say so, rather than quietly answering
    # with the home page and hiding it.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # config.js names this deployment's portal and the centre's phone
    # number, and it keeps that name across deploys. Cached, it points
    # visitors at whatever the previous deployment said.
    location = /config.js {
        add_header Cache-Control "no-store" always;
    }

    # content.js is written by scripts/site-export.sh from the staff
    # console's tables and keeps its name across deploys, exactly like
    # config.js. Cached, the centre changes its phone number in the
    # console, the export runs, the deploy succeeds - and visitors keep
    # the old one with nothing to show anything went wrong.
    location = /content.js {
        add_header Cache-Control "no-store" always;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-store" always;
    }

    # The page loads nothing of its own but Google Fonts. Saying so here
    # means an injected script tag does not run, whatever put it in the
    # markup.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/hbh-site.access.log;
    error_log  /var/log/nginx/hbh-site.error.log;
}

server {
    listen 127.0.0.1:8091;
    # listen 443 ssl;
    # server_name hbh.199-241-137-175.sslip.io;

    root /home/collab/hand-by-hand/web/dist/portal/browser;
    index index.html;

    # The Angular router owns every path that is not a real file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same origin as the page above - this is what makes apiBaseUrl
    # empty work. The trailing slashes on both sides matter: without
    # them /api/v1/auth reaches the service as /v1/auth.
    location /api/ {
        proxy_pass http://127.0.0.1:8090/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The service is configured with TRUST_PROXY=false, so it does
        # not believe the header above. It is set for the log, not for
        # any decision the service makes.
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8090/healthz;
    }

    # index.html must never be cached, or a deploy is invisible until
    # the browser decides otherwise. The hashed bundles beside it can be
    # cached forever, because their names change when they do.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    access_log /var/log/nginx/hbh-portal.access.log;
    error_log  /var/log/nginx/hbh-portal.error.log;
}

server {
    listen 127.0.0.1:8092;
    # listen 443 ssl;
    # server_name hbh-ops.199-241-137-175.sslip.io;

    root /home/collab/hand-by-hand/web/dist/ops/browser;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8090/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8090/healthz;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    access_log /var/log/nginx/hbh-ops.access.log;
    error_log  /var/log/nginx/hbh-ops.error.log;
}
