# =====================================================================
# Hand By Hand (new) - local development stack
#
# Nothing is installed on the host. Postgres, the Go API and the
# Angular tooling all run in containers.
#
#   scripts/db.sh    up | migrate | verify | reset | psql | app
#   scripts/api.sh   up | build | verify | logs | down
#
# The clock is UTC on both sides. Every instant is stored and compared
# in UTC; the centre's local time is a display concern only.
# =====================================================================
name: hbh

services:
  db:
    image: postgres:17-alpine
    container_name: hbh-db
    environment:
      POSTGRES_DB: hbh
      # hbh_owner owns the schema and runs migrations.
      # It is NOT the role the API connects as - see 0001_foundation.sql.
      POSTGRES_USER: hbh_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:-hbh_dev_only_change_me}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
      # Log every statement error so a failing migration is readable.
      - -c
      - log_min_error_statement=error
    ports:
      # This machine already runs other Postgres containers on 5432 and
      # 5433, so the default here is 5434. Override with DB_PORT in .env
      # if that one is taken too - nothing in the project hardcodes it.
      #
      # BIND_ADDR is the interface the port is published on. It defaults
      # to every interface, which is right on a developer machine and
      # wrong on a host with a public address: the clinical record would
      # answer the open internet on this port. A deployment sets
      # BIND_ADDR=127.0.0.1 and reaches the database through a tunnel.
      - "${BIND_ADDR:-0.0.0.0}:${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hbh_owner -d hbh"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # -------------------------------------------------------------------
  # hbhd - the parent portal API
  #
  # It connects as hbh_app and NOT as hbh_owner. That is the whole of
  # D-2: Postgres bypasses row level security for the owner of a table,
  # so an API on the owner's credentials would make every policy in the
  # schema decorative, silently. The service checks this itself at boot
  # and refuses to start if it is ever wired the other way.
  # -------------------------------------------------------------------
  api:
    build:
      context: ../../api
      dockerfile: Dockerfile
    container_name: hbh-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_LISTEN: ":8090"
      # sslmode is disabled only because both ends are inside this
      # compose network. A deployment where they are not must set it.
      DATABASE_URL: postgres://hbh_app:${DB_APP_PASSWORD:-hbh_app_dev_only_change_me}@db:5432/hbh?sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
      # There is no SMS gateway yet, so the one-time code comes back in
      # the response. config.Load refuses to start with this on unless
      # APP_ENV is development - see api/internal/config/config.go.
      OTP_ECHO: ${OTP_ECHO:-true}
      # THE DELIVERY CHANNEL, and the second half of the same rule.
      #
      # dev accepts every message and sends nothing, which is right for a
      # compose stack on a laptop. config.Load REFUSES TO START with it
      # unless APP_ENV is development - because turning OTP_ECHO off
      # without a provider does not make production safe, it makes
      # production quietly unusable: every login accepted, every code
      # discarded, and no log line anywhere saying nobody can sign in.
      SMS_PROVIDER: ${SMS_PROVIDER:-dev}
      SMS_HTTP_URL: ${SMS_HTTP_URL:-}
      SMS_HTTP_USERNAME: ${SMS_HTTP_USERNAME:-}
      SMS_HTTP_PASSWORD: ${SMS_HTTP_PASSWORD:-}
      SMS_HTTP_SENDER_ID: ${SMS_HTTP_SENDER_ID:-}
      SMS_WORKER_SECONDS: ${SMS_WORKER_SECONDS:-5}
      SMS_WORKER_BATCH: ${SMS_WORKER_BATCH:-20}
      # Twilio, when SMS_PROVIDER is twilio_whatsapp. Every one of these
      # is named here or it does not reach the process at all: this file
      # passes variables one by one, so a value set in .env and not
      # listed here is silently absent - which config.Load then reports
      # as a missing setting nobody can find, because it IS set.
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      TWILIO_CONTENT_SIDS: ${TWILIO_CONTENT_SIDS:-}
      TWILIO_STATUS_CALLBACK: ${TWILIO_STATUS_CALLBACK:-}
      # Development only; config.Load refuses to start with it set when
      # APP_ENV is not development.
      TWILIO_ALLOW_FREEFORM: ${TWILIO_ALLOW_FREEFORM:-false}
      # No proxy in front of this container, so X-Forwarded-For is a
      # client-written header and is not believed.
      TRUST_PROXY: "false"
      # Per caller address, over the login endpoints only. The database
      # already throttles one account; this is what stops a caller
      # walking a list of numbers, one attempt each.
      AUTH_RATE_PER_MINUTE: ${AUTH_RATE_PER_MINUTE:-60}
      TZ: UTC
      # Where an uploaded photograph or introduction film is written. The
      # database stores the PATH; the bytes never enter it. A film in a
      # bytea column would be copied into every pg_dump, and the backups
      # here have already caused one incident.
      #
      # It is the site's own assets directory, so a file is served from the
      # same origin as the page that shows it - no third party in front of
      # a visitor to a page about children's therapy.
      SITE_ASSETS_DIR: /srv/site-assets
      # Staff documents. A DIFFERENT directory, because /api/v1/site-media
      # serves the one above with no authentication - it is a public
      # page's photographs. A scan of somebody's identity card is served
      # only through an authenticated route that resolves it by database
      # row, and putting one in the open directory because the directory
      # already existed is how a leak happens with nobody deciding it.
      #
      # NOT under the project tree: that is on OneDrive, and staff
      # identity documents must not be synced to a personal cloud account
      # - the exact incident this project already had with its backups.
      STAFF_DOCS_DIR: /srv/staff-docs
    volumes:
      - ../../site/assets:/srv/site-assets
      - staffdocs:/srv/staff-docs
    ports:
      # 8080, 8081 and 8088 are taken by other containers on this
      # machine. Nothing hardcodes this - override API_PORT in .env.
      # BIND_ADDR as above: 127.0.0.1 on any host with a public address.
      - "${BIND_ADDR:-0.0.0.0}:${API_PORT:-8090}:8090"
    restart: unless-stopped

  # -------------------------------------------------------------------
  # hbh-maintenance - the thing that was missing
  #
  # expire_packages was written, tested and correct, and NOTHING called
  # it. A package stayed ACTIVE past its expiry until somebody happened
  # to try to use one, and the ledger entry explaining the forfeited
  # sessions was never written.
  #
  # No custom Postgres image and no pg_cron: pg_cron needs
  # shared_preload_libraries, which means building and maintaining our
  # own database image for one scheduled call. This is the same psql
  # that is already pulled, in a loop.
  #
  # hbh.run_maintenance records every run, so a scheduler that dies is
  # visible in hbh.v_maintenance_health instead of being noticed a month
  # later.
  # -------------------------------------------------------------------
  maintenance:
    image: postgres:17-alpine
    container_name: hbh-maintenance
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_OWNER_PASSWORD:-hbh_dev_only_change_me}
      INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-3600}
      TZ: UTC
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          psql -h db -U hbh_owner -d hbh -v ON_ERROR_STOP=1 \
               -c "SELECT hbh.run_maintenance();" \
            || echo "maintenance run failed - see hbh.maintenance_runs"
          sleep "$$INTERVAL_SECONDS"
        done
    restart: unless-stopped

  # -------------------------------------------------------------------
  # The two Angular dev servers
  #
  # These ran for weeks as a hand-made container: `docker run ... sleep
  # infinity`, with `ng serve` started afterwards by whoever needed it.
  # Two things followed from that, and both bit.
  #
  # A server that dies stays dead. Nothing supervised them, so the
  # container kept reporting "Up" with no server inside it and both
  # ports refusing connections - which reads as a code fault and is not
  # one. One service per server, with a restart policy, is what makes
  # "Up" mean the same thing as "answering".
  #
  # And node_modules lived in a session scratchpad under the Windows
  # temp directory. Temp gets cleaned. It was cleaned: @angular/core,
  # rxjs and typescript were deleted out from under the running servers,
  # leaving the eighteen packages that happened to hold open file
  # handles at that moment. A named volume is not on anybody's cleanup
  # list. It is not in the project tree either, deliberately - the
  # project is under OneDrive, and node_modules would sync.
  #
  # --poll is required: filesystem notifications do not cross the
  # Windows-to-Linux bridge, so without it the watcher goes quiet after
  # the first build and every later edit is simply never read.
  #
  # proxy.conf.docker.json, not proxy.conf.json: inside a container
  # localhost is the container itself, so the API is reached at
  # host.docker.internal.
  # -------------------------------------------------------------------
  web-portal:
    image: node:22-alpine
    container_name: hbh-web-portal
    working_dir: /app
    command:
      - node_modules/.bin/ng
      - serve
      - portal
      - --host
      - 0.0.0.0
      - --port
      - "4200"
      - --proxy-config
      - proxy.conf.docker.json
      - --poll
      - "2000"
    volumes:
      - ../../web:/app
      - webmodules:/app/node_modules
      - webcache:/app/.angular
    ports:
      # 4200 and 4300 are taken on this machine, so the host side is
      # shifted by ten. Nothing in the code knows these numbers.
      - "${BIND_ADDR:-0.0.0.0}:${PORTAL_PORT:-4210}:4200"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web-ops:
    image: node:22-alpine
    container_name: hbh-web-ops
    working_dir: /app
    command:
      - node_modules/.bin/ng
      - serve
      - ops
      - --host
      - 0.0.0.0
      - --port
      - "4300"
      - --proxy-config
      - proxy.conf.docker.json
      - --poll
      - "2000"
    volumes:
      - ../../web:/app
      - webmodules:/app/node_modules
      - webcache:/app/.angular
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${OPS_PORT:-4310}:4300"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  pgdata:
    name: hbh_pgdata
  # Installed once with `npm ci`, never from the project tree. See the
  # note on web-portal for why it is not in a scratchpad.
  webmodules:
    name: hbh_web_node_modules
  webcache:
    name: hbh_web_angular_cache
  # Staff identity documents. A named volume rather than a bind mount into
  # the project: the project lives on OneDrive, and these must not sync.
  staffdocs:
    name: hbh_staff_docs
